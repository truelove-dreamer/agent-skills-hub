name: update-rankings

# 每周日 UTC 0 点自动更新榜单；也可手动触发（workflow_dispatch）。
on:
  push:
    branches: [master]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Auto-discover new skills
        run: python scripts/discover.py --auto-add --token ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch stars
        run: python scripts/fetch_stars.py --token ${{ secrets.GITHUB_TOKEN }}
      - name: Generate rankings and README
        run: python scripts/generate_rankings.py
      - name: Validate data
        run: python scripts/validate_data.py --check
      - name: Run tests
        run: python -m pytest -q
      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skills.json data/snapshots site/data README.md
          git commit -m "chore: 更新榜单数据 $(date -u +%Y-%m-%d) [skip ci]" || echo "无变更"
          git push
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
